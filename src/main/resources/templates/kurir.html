<html>
<head>
    <title>Produk Page</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/homekurir.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/tablekurir.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/formkurir.css}"/>
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body>

    <div class="navbar">
            <div class="navbarTitle">
                <a href="/menu"><h1>Ekspedisi Barang</h1></a>
            </div>
            <div class="navbarItems">
                <div class="navbarLinks">
                    <a href="/pelanggan">Pelanggan</a>
                    <a href="/kurir">Kurir</a>
                    <a href="/barang">List Barang</a>
                    <a href="/pengiriman">List Pengiriman</a>
                    <a href="/transaksi">List Transaksi</a>
                    <a th:href="@{/logoutMenu}">Logout</a>
                </div>
                <div class="navbarButton">
                    <i class="bi bi-list"></i>
                </div>
            </div>
        </div>

    <div class="first-box">
        <h2>List Kurir</h2>
        <table class="styled-table">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>ID Kurir</th>
                    <th>Perusahaan</th>
                    <th>Tipe</th>
                </tr>
            </thead>
            <tbody th:each="p, no : ${kurirList}">
                <tr>
                    <td>
                        <a th:href="@{/kurir/{id}(id=${p.getAccountID()})}" th:text="${p.getAccountID()}"></a>
                    </td>
                    <td th:text="${p.getNama()}"></td>
                    <td th:text="${p.getKurirID()}"></td>
                    <td th:text="${p.getPerusahaanKurir()}"></td>
                    <td th:text="${p.getJenisOrang()}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="second-box">
        <div id="feedback-form">
            <h2 class="header">Form Management</h2>
            <form th:action="@{/kurir/submit/{id}(id=${kurirRec?.getAccountID()})}"
                  method="post" th:object="${kurirInfo}" class="form-group">

                <label for="AccountID" class="form-label">ID</label>
                <input type="number" id="AccountID" name="AccountID"
                       th:value="${kurirRec != null} ? ${kurirRec.getAccountID()} : '0'"
                       readonly />

                <label for="nama" class="form-label">Nama</label>
                <input type="text" id="nama" name="nama"
                       th:value="${kurirRec?.getNama()}"
                       required />

                <label for="kurirID" class="form-label">Kurir ID</label>
                <input type="text" id="kurirID" name="kurirID"
                       th:value="${kurirRec?.getKurirID()}"
                       required />

                  <label for="perusahaanKurir" class="form-label">Perusahaan Kurir</label>
                <input type="text" id="perusahaanKurir" name="perusahaanKurir"
                       th:value="${kurirRec?.getPerusahaanKurir()}"
                       required />

                <div class="button-group">
                    <button type="submit" class="btn btn-primary" name="add">Add</button>
                    <button type="submit" class="btn btn-success" name="edit">Edit</button>
                    <button type="submit" class="btn btn-danger" name="delete" th:data-confirm-delete="|Are you sure you want to delete this Customer 
                    ${kurirRec?.getAccountID()}?|" onclick="if (!confirm(this.getAttribute('data-confirm-delete'))) return false">Delete</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
